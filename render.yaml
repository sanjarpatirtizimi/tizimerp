services:
  # ---------------------------------------------------------------------------
  # Backend — NestJS API (Prisma + PostgreSQL)
  # ---------------------------------------------------------------------------
  - type: web
    name: driver-loyalty-backend
    runtime: node
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: STAMP_AMOUNT_UZS
        value: "30000"
      - key: RECOGNITION_COOLDOWN_MINUTES
        value: "60"
      - key: DEVICE_CREDENTIALS_ENC_KEY
        sync: false
      - key: HIKVISION_WEBHOOK_SECRET
        generateValue: true

  # ---------------------------------------------------------------------------
  # Frontend — Next.js
  # ---------------------------------------------------------------------------
  - type: web
    name: driver-loyalty-frontend
    runtime: node
    rootDir: frontend
    plan: free
    autoDeploy: true
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
